# Katago Scythe Rule Configuration
# For 11x11 board with CPU backend

# Basic settings
logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false

# 默认棋盘大小（避免重复初始化）
defaultBoardXSize = 11
defaultBoardYSize = 11

# Rules
rules = chinese

# Scythe settings (解除手数限制: 全程可用镰刀)
scytheMinMove = 1
scytheMaxMove = 999

# Resignation settings
allowResignation = false
resignThreshold = -0.99
resignConsecTurns = 3

# Performance (超轻量调试模式)
numSearchThreads = 2
nnMaxBatchSize = 1

# Search settings (最小计算量 - 调试用)
maxVisits = 20
maxPlayouts = 20
maxTime = 2

# 启动优化
nnCacheSizePowerOfTwo = 16
numNNServerThreadsPerModel = 1

# Pondering - 关闭以节省资源
ponderingEnabled = false

# Analysis
reportAnalysisWinratesAs = BLACK
