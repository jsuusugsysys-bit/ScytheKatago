# KataGo Scythe Training - 终极优化版
# 基于镰刀规则特性：双方镰刀用完后胜负往往已定
# 8x RTX 5090 + 11x11 极致优化

# Logs------------------------------------------------------------------------------------
logSearchInfo = false
logMoves = false
logGamesEvery = 50
logToStdout = true

# Data writing-----------------------------------------------------------------------------------
dataBoardLen = 11
maxDataQueueSize = 3000
maxRowsPerTrainFile = 30000
firstFileRandMinProp = 0.15

# Fancy game selfplay settings--------------------------------------------------------------------
earlyForkGameProb = 0.02
earlyForkGameExpectedMoveProp = 0.03
forkGameProb = 0.005
forkGameMinChoices = 3
earlyForkGameMaxChoices = 8
forkGameMaxChoices = 20
sekiForkHackProb = 0.01

initGamesWithPolicy = true
policyInitAreaProp = 0.06
compensateAfterPolicyInitProb = 0.15
sidePositionProb = 0.015

# 11路+镰刀快速对局优化
cheapSearchProb = 0.85
cheapSearchVisits = 50
cheapSearchTargetWeight = 0.0

reduceVisits = true
reduceVisitsThreshold = 0.92
reduceVisitsThresholdLookback = 3
reducedVisitsMin = 50
reducedVisitsWeight = 0.1

handicapAsymmetricPlayoutProb = 0.3
normalAsymmetricPlayoutProb = 0.008
maxAsymmetricRatio = 6.0
minAsymmetricCompensateKomiProb = 0.35

policySurpriseDataWeight = 0.5
valueSurpriseDataWeight = 0.1

estimateLeadProb = 0.50
switchNetsMidGame = true
fancyKomiVarying = true

# Match-----------------------------------------------------------------------------------
# 大幅增加并行数
numGameThreads = 3200
# 镰刀规则关键优化：双方镰刀用完(第49手)后再下10-15手足够判断
# 不需要下完整盘！
maxMovesPerGame = 65

# Rules------------------------------------------------------------------------------------
koRules = SIMPLE,POSITIONAL,SITUATIONAL
scoringRules = AREA
taxRules = NONE,NONE,SEKI,SEKI,ALL
multiStoneSuicideLegals = false,true
hasButtons = false,false,true

# 仅 11x11
bSizes = 11
bSizeRelProbs = 100
allowRectangleProb = 0.0

komiAuto = True
komiStdev = 0.8
komiBigStdevProb = 0.04
komiBigStdev = 8.0

handicapProb = 0.05
handicapCompensateKomiProb = 0.50
forkCompensateKomiProb = 0.80
sgfCompensateKomiProb = 0.90

drawRandRadius = 0.5
noResultStdev = 0.15

# Scythe-specific settings-----------------------------------------------------------------------------------
scytheRandomMode = true
# 前期训练用更高触发率，让AI充分学习镰刀
scytheRandomTriggerRate = 0.50

# Resign settings - 镰刀规则优化 --------------------------------------------------------------
# 镰刀用完后如果大幅落后，应该提前认输
allowResignation = true
# 提高resign阈值（更激进认输）
resignThreshold = -0.85
# 减少连续确认次数（镰刀后形势明朗，不需要反复确认）
resignConsecTurns = 2
resignMinMovesPerGame = 50

# Search limits-----------------------------------------------------------------------------------
# 11路不需要太深搜索
maxVisits = 280
numSearchThreads = 1

# GPU Settings-------------------------------------------------------------------------------
# 8x RTX 5090 极致优化
nnMaxBatchSize = 640
nnCacheSizePowerOfTwo = 25
nnMutexPoolSizePowerOfTwo = 19
numNNServerThreadsPerModel = 8
nnRandomize = true

cudaDeviceToUseModel0Thread0 = 0
cudaDeviceToUseModel0Thread1 = 1
cudaDeviceToUseModel0Thread2 = 2
cudaDeviceToUseModel0Thread3 = 3
cudaDeviceToUseModel0Thread4 = 4
cudaDeviceToUseModel0Thread5 = 5
cudaDeviceToUseModel0Thread6 = 6
cudaDeviceToUseModel0Thread7 = 7

cudaUseFP16 = true
cudaUseNHWC = true

# Root move selection and biases------------------------------------------------------------------------------
chosenMoveTemperatureEarly = 0.80
chosenMoveTemperatureHalflife = 15
chosenMoveTemperature = 0.18
chosenMoveSubtract = 0
chosenMovePrune = 1

rootNoiseEnabled = true
rootDirichletNoiseTotalConcentration = 8.0
rootDirichletNoiseWeight = 0.28

rootDesiredPerChildVisitsCoeff = 2
rootNumSymmetriesToSample = 4

useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

# Internal params------------------------------------------------------------------------------
winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.00
dynamicScoreUtilityFactor = 0.45
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50
noResultUtilityForWhite = 0.0
drawEquivalentWinsForWhite = 0.5

rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true

rootPolicyTemperatureEarly = 1.30
rootPolicyTemperature = 1.15

cpuctExploration = 1.15
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.0

numVirtualLossesPerThread = 1

valueWeightExponent = 0.5
subtreeValueBiasFactor = 0.35
subtreeValueBiasWeightExponent = 0.8
useNonBuggyLcb = true
useGraphSearch = true
fpuParentWeightByVisitedPolicy = true
fpuParentWeightByVisitedPolicyPow = 2.0
