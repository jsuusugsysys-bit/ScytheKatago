# Katago Scythe Rule Configuration for Analysis
# For 11x11 board with CPU backend

# Basic settings
logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false

# 默认棋盘大小
defaultBoardXSize = 11
defaultBoardYSize = 11

# Rules
rules = chinese

# Resignation settings
allowResignation = false
resignThreshold = -0.99
resignConsecTurns = 3

# Performance (更多计算量用于分析)
numSearchThreads = 2
nnMaxBatchSize = 4

# Search settings (足够的计算量)
maxVisits = 1000
maxPlayouts = 1000
maxTime = 30

# 启动优化
nnCacheSizePowerOfTwo = 18
numNNServerThreadsPerModel = 1

# Pondering - 关闭
ponderingEnabled = false

# Analysis
reportAnalysisWinratesAs = BLACK
